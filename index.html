<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0f14;
        color: #e8edf3;
        line-height: 1.7;
    }

    a {
        color: inherit;
        text-decoration: none;
    }


    /* =========================
       NAVIGATION
    ========================= */

    nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(11, 15, 20, 0.97);
        border-bottom: 1px solid #202833;
        padding: 18px 4%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 20px;
        font-weight: bold;
    }

    .nav-links {
        display: flex;
        gap: 30px;
        font-size: 15px;
        color: #aeb8c5;
    }

    .nav-links a:hover {
        color: #ffffff;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
        min-height: 82vh;
        display: flex;
        align-items: center;
        padding: 80px 8%;
        border-bottom: 1px solid #202833;
    }

    .hero-content {
        width: 100%;
        max-width: 1200px;
    }

    .hero h1 {
        font-size: clamp(48px, 6vw, 78px);
        line-height: 1.02;
        letter-spacing: -2px;
        margin-bottom: 25px;
        white-space: nowrap;
    }

    .hero h1 span {
        display: block;
        color: #8ea9c5;
        font-size: 0.62em;
        margin-top: 8px;
        letter-spacing: -1px;
    }

    .hero p {
        max-width: 1050px;
        font-size: 20px;
        color: #aeb8c5;
        margin-bottom: 34px;
    }

    .buttons {
        display: flex;
        gap: 15px;
    }

    .button {
        padding: 12px 22px;
        border: 1px solid #465363;
        border-radius: 6px;
        font-size: 15px;
        transition: 0.2s ease;
    }

    .button:hover {
        background: #151c25;
        border-color: #718196;
    }


    /* =========================
       HERO / CORE EXPERTISE
    ========================= */

    .hero-layout {
        display: grid;
        grid-template-columns: 1.5fr 0.75fr;
        gap: 60px;
        align-items: center;
    }

    .expertise-card {
        border: 1px solid #27313d;
        border-radius: 12px;
        background: #0e141b;
        padding: 34px;
    }

    .expertise-card h3 {
        color: #8ea9c5;
        font-size: 18px;
        letter-spacing: 2px;
        margin-bottom: 32px;
    }

    .expertise-item {
        padding: 18px 0;
        border-bottom: 1px solid #27313d;
        font-size: 18px;
    }

    .expertise-item:last-child {
        border-bottom: none;
    }


    /* =========================
       GENERAL SECTIONS
    ========================= */

    section {
        padding: 80px 4%;
        border-bottom: 1px solid #202833;
    }

    .section-inner {
        max-width: 1450px;
        margin: 0 auto;
    }

    .section-title {
        font-size: 32px;
        margin-bottom: 30px;
    }


    /* =========================
       ABOUT
    ========================= */

    .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
    }

    .about-card {
        border: 1px solid #27313d;
        padding: 30px;
        border-radius: 10px;
        background: #0e141b;
    }

    .about-card h3 {
        margin-bottom: 15px;
        font-size: 21px;
    }

    .about-card p {
        color: #aeb8c5;
    }


    /* =========================
       PROJECT HEADER
    ========================= */

    .project-header {
        margin-bottom: 55px;
    }

    .project-header h3 {
        font-size: clamp(24px, 3vw, 38px);
        line-height: 1.15;
        margin-bottom: 18px;
        white-space: nowrap;
    }


    /* =========================
       PROBLEM / OBJECTIVE
    ========================= */

    .problem-grid {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 28px;
        margin-bottom: 70px;
    }

    .content-card {
        border: 1px solid #27313d;
        border-radius: 10px;
        padding: 30px;
        background: #0e141b;
    }

    .content-card h4 {
        font-size: 21px;
        margin-bottom: 16px;
    }

    .content-card p {
        color: #aeb8c5;
    }


    /* =========================
       FE MODEL DEVELOPMENT
    ========================= */

    .fe-section {
        margin-bottom: 70px;
    }

    .fe-section h3,
    .explicit-section h3,
    .trigger-section h3,
    .results-section h3 {
        font-size: 28px;
        margin-bottom: 15px;
    }

    .fe-description {
        width: 100%;
        max-width: none;
        color: #aeb8c5;
        margin-bottom: 35px;
    }

    .fe-images {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
    }

    .image-card {
        border: 1px solid #27313d;
        border-radius: 10px;
        background: #0e141b;
        padding: 14px;
        overflow: hidden;
    }

    .image-card img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 430px;
        object-fit: contain;
        border-radius: 6px;
        background: #0b0f14;
    }

    .image-caption {
        padding: 15px 7px 6px;
        color: #c4ced9;
        font-size: 14px;
        text-align: center;
    }

    .image-caption strong {
        display: block;
        color: #e8edf3;
        margin-bottom: 4px;
    }


    /* =========================
       EXPLICIT SIMULATION
    ========================= */

    .explicit-section {
        margin-bottom: 70px;
    }

    .explicit-intro {
        width: 100%;
        max-width: none;
        color: #aeb8c5;
        margin-bottom: 30px;
    }

    .explicit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .explicit-card {
        border: 1px solid #27313d;
        border-radius: 10px;
        padding: 30px;
        background: #0e141b;
    }

    .explicit-card h4 {
        font-size: 21px;
        margin-bottom: 16px;
    }

    .explicit-card ul {
        padding-left: 20px;
        color: #aeb8c5;
    }

    .explicit-card li {
        margin-bottom: 9px;
    }


    /* =========================
       TRIGGER CONFIGURATIONS
    ========================= */

    .trigger-section {
        margin-bottom: 70px;
    }

    .trigger-description {
        width: 100%;
        max-width: none;
        color: #aeb8c5;
        margin-bottom: 30px;
    }

    .trigger-image {
        width: 100%;
        border: 1px solid #27313d;
        border-radius: 10px;
        background: #0e141b;
        padding: 16px;
        overflow: hidden;
    }

    .trigger-image img {
        display: block;
        width: 100%;
        max-width: 1250px;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
        border-radius: 7px;
    }


    /* =========================
       RESULTS
    ========================= */

    .results-section {
        margin-bottom: 25px;
    }

    .results-description {
        width: 100%;
        max-width: none;
        color: #aeb8c5;
        margin-bottom: 30px;
    }

    .result-image {
        width: 100%;
        border: 1px solid #27313d;
        border-radius: 10px;
        background: #0e141b;
        padding: 15px;
    }

    .result-image img {
        display: block;
        width: 100%;
        max-width: 1250px;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
        border-radius: 7px;
    }


    /* =========================
       CRASHWORTHINESS METRICS
    ========================= */

    .metrics {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
        margin-top: 24px;
    }

    .metric {
        border: 1px solid #27313d;
        border-radius: 8px;
        background: #0e141b;
        padding: 24px 15px;
        text-align: center;
    }

    .metric strong {
        display: block;
        font-size: 23px;
        margin-bottom: 10px;
        color: #e8edf3;
    }

    .metric span {
        color: #8ea9c5;
        font-size: 14px;
    }


    /* =========================
       KEY FINDINGS
    ========================= */

    .findings {
        display: grid;
        gap: 16px;
        max-width: 1300px;
    }

    .finding {
        padding: 20px 25px;
        border: 1px solid #27313d;
        border-left: 3px solid #6f9ac8;
        border-radius: 7px;
        background: #0e141b;
        color: #bfc9d5;
    }


    /* =========================
       SKILLS
    ========================= */

    .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        max-width: 1200px;
    }

    .skill {
        padding: 10px 15px;
        border: 1px solid #303b48;
        border-radius: 6px;
        color: #c7d0da;
        background: #0e141b;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
        padding: 45px 7%;
        color: #7f8b99;
        font-size: 14px;
        text-align: center;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {

        .hero-layout {
            grid-template-columns: 1fr;
            gap: 45px;
        }

        .problem-grid {
            grid-template-columns: 1fr;
        }

        .fe-images {
            grid-template-columns: 1fr;
        }

        .explicit-grid {
            grid-template-columns: 1fr;
        }

        .metrics {
            grid-template-columns: repeat(2, 1fr);
        }

        .project-header h3 {
            white-space: normal;
        }
    }


    @media (max-width: 800px) {

        nav {
            padding: 16px 5%;
        }

        .nav-links {
            display: none;
        }

        .hero {
            min-height: 75vh;
            padding: 65px 7%;
        }

        .hero h1 {
            font-size: clamp(42px, 11vw, 64px);
            letter-spacing: -1px;
            white-space: normal;
        }

        .hero p {
            font-size: 17px;
        }

        section {
            padding: 65px 5%;
        }

        .about-grid {
            grid-template-columns: 1fr;
        }

        .section-title {
            font-size: 28px;
        }

        .project-header h3 {
            font-size: 30px;
            white-space: normal;
        }

        .metrics {
            grid-template-columns: 1fr 1fr;
        }
    }


    @media (max-width: 520px) {

        .metrics {
            grid-template-columns: 1fr;
        }

        .expertise-card {
            padding: 25px;
        }

        .expertise-item {
            font-size: 16px;
        }
    }

</style>
